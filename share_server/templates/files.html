<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件列表 - Share Server</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" style="text-decoration: none;">
                <div class="logo">CYBER SHARE</div>
            </a>
            <p class="text-secondary">已上传的文件列表</p>
        </header>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">文件列表</h2>
                <button class="btn btn-sm" id="refreshBtn">刷新列表</button>
            </div>
            <div class="card-body">
                <div id="loading" class="text-center text-secondary">加载中...</div>
                <div id="emptyMessage" class="text-center text-secondary" style="display: none;">
                    <p>暂无文件</p>
                    <a href="/upload" class="btn btn-primary mt-2">上传文件</a>
                </div>
                <div id="filesGrid" class="grid grid-responsive" style="display: none;"></div>
            </div>
        </div>

        <nav>
            <a href="/" class="btn">返回首页</a>
            <a href="/upload" class="btn btn-primary">上传文件</a>
        </nav>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="modal-backdrop" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">请输入密码</h3>
                <button class="modal-close" onclick="closePasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="filePassword" class="form-label">访问密码</label>
                    <input type="password" id="filePassword" class="form-control" placeholder="输入密码以访问文件">
                </div>
                <div id="passwordError" class="alert alert-danger" style="display: none;">
                    密码错误，请重试
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
                <button class="btn btn-primary" id="submitPasswordBtn">确认</button>
            </div>
        </div>
    </div>

    <script>
        let currentFileId = null;

        // Load files on page load
        document.addEventListener('DOMContentLoaded', loadFiles);

        // Refresh button
        document.getElementById('refreshBtn').addEventListener('click', loadFiles);

        // Load files from API
        async function loadFiles() {
            const loading = document.getElementById('loading');
            const emptyMessage = document.getElementById('emptyMessage');
            const filesGrid = document.getElementById('filesGrid');

            loading.style.display = 'block';
            emptyMessage.style.display = 'none';
            filesGrid.style.display = 'none';

            try {
                const response = await fetch('/api/files');
                if (!response.ok) throw new Error('Failed to load files');

                const files = await response.json();
                loading.style.display = 'none';

                if (files.length === 0) {
                    emptyMessage.style.display = 'block';
                } else {
                    renderFiles(files);
                    filesGrid.style.display = 'grid';
                }
            } catch (error) {
                loading.style.display = 'none';
                emptyMessage.innerHTML = '<p class="text-neon-magenta">加载失败，请刷新重试</p>';
                emptyMessage.style.display = 'block';
            }
        }

        // Render files grid
        function renderFiles(files) {
            const filesGrid = document.getElementById('filesGrid');
            filesGrid.innerHTML = files.map(file => `
                <div class="card file-card">
                    <div class="card-body">
                        <h3 class="font-semibold text-primary mb-2" style="word-break: break-all;">${escapeHtml(file.filename)}</h3>
                        <div class="text-secondary text-sm mb-2">
                            <p>大小: ${formatFileSize(file.file_size)}</p>
                            <p>上传时间: ${formatDate(file.upload_time)}</p>
                            <p>下载次数: ${file.downloads_count}</p>
                            ${file.has_password ? '<p class="text-neon-magenta">有密码保护</p>' : ''}
                        </div>
                    </div>
                    <div class="card-footer" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <button class="btn btn-sm btn-primary" onclick="handleDownload(${file.id}, ${file.has_password})">
                            下载
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="handleDelete(${file.id})">
                            删除
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Handle file download
        function handleDownload(fileId, hasPassword) {
            if (hasPassword) {
                openPasswordModal(fileId);
            } else {
                window.location.href = `/api/files/${fileId}`;
            }
        }

        // Handle file deletion
        async function handleDelete(fileId) {
            if (!confirm('确定要删除这个文件吗？')) {
                return;
            }

            try {
                const response = await fetch(`/api/files/${fileId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete file');
                }

                // Reload files after successful deletion
                loadFiles();
            } catch (error) {
                alert('删除失败，请重试');
            }
        }

        // Open password modal
        function openPasswordModal(fileId) {
            currentFileId = fileId;
            const passwordModal = document.getElementById('passwordModal');
            const passwordInput = document.getElementById('filePassword');
            const passwordError = document.getElementById('passwordError');

            passwordModal.style.display = 'flex';
            passwordInput.value = '';
            passwordError.style.display = 'none';
            passwordInput.focus();
        }

        // Close password modal
        function closePasswordModal() {
            const passwordModal = document.getElementById('passwordModal');
            passwordModal.style.display = 'none';
            currentFileId = null;
        }

        // Submit password
        document.getElementById('submitPasswordBtn').addEventListener('click', async function() {
            const passwordInput = document.getElementById('filePassword');
            const passwordError = document.getElementById('passwordError');
            const password = passwordInput.value.trim();

            if (!password) {
                passwordError.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`/api/files/${currentFileId}?password=${encodeURIComponent(password)}`);

                if (response.ok) {
                    // Password correct, trigger download
                    window.location.href = `/api/files/${currentFileId}?password=${encodeURIComponent(password)}`;
                    closePasswordModal();
                } else {
                    passwordError.style.display = 'block';
                }
            } catch (error) {
                passwordError.style.display = 'block';
            }
        });

        // Allow Enter key to submit password
        document.getElementById('filePassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('submitPasswordBtn').click();
            }
        });

        // Close modal on backdrop click
        document.getElementById('passwordModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePasswordModal();
            }
        });

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return '刚刚';
            if (diffMins < 60) return `${diffMins}分钟前`;
            if (diffHours < 24) return `${diffHours}小时前`;
            if (diffDays < 7) return `${diffDays}天前`;

            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
